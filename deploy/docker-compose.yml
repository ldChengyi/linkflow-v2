name: linkflow-v2

# ============================================================
# LinkFlow v2 - 第一阶段基础设施
# 包含: EMQX (MQTT)、Redpanda (Kafka)、TimescaleDB、Redis
# 后续阶段会逐步添加: MinIO、Nacos、APISIX、Jaeger、Prometheus 等
# ============================================================

services:
  # ============================================
  # EMQX - MQTT Broker (设备接入)
  # Dashboard: http://localhost:18083  (admin / public)
  # MQTT TCP:  1883
  # ============================================
  emqx:
    image: emqx/emqx:5.10.0
    container_name: linkflow-emqx
    restart: unless-stopped
    ports:
      - "${EMQX_MQTT_PORT:-1883}:1883" # MQTT TCP
      - "${EMQX_WS_PORT:-8083}:8083" # MQTT WebSocket
      - "${EMQX_DASHBOARD_PORT:-18083}:18083" # Dashboard
    environment:
      EMQX_NAME: ${EMQX_NAME:-linkflow-emqx}
      EMQX_HOST: ${EMQX_HOST:-127.0.0.1}
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD__DEFAULT_USERNAME:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD__DEFAULT_PASSWORD:-public}
      EMQX_API_KEY__BOOTSTRAP_FILE: ${EMQX_API_KEY__BOOTSTRAP_FILE:-/opt/emqx/etc/default_api_key.conf}
      EMQX_ALLOW_ANONYMOUS: "${EMQX_ALLOW_ANONYMOUS:-false}"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
      - ./init-scripts/emqx/default_api_key.conf:/opt/emqx/etc/default_api_key.conf:ro
    healthcheck:
      test: [ "CMD", "/opt/emqx/bin/emqx", "ctl", "status" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - linkflow

  emqx-init:
    image: badouralix/curl-jq:latest
    container_name: linkflow-emqx-init
    restart: "no"
    depends_on:
      emqx:
        condition: service_healthy
      backend:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      EMQX_API_URL: ${EMQX_CONTAINER_API_URL:-http://emqx:18083}
      EMQX_API_KEY: ${EMQX_API_KEY:-linkflow-init}
      EMQX_API_SECRET: ${EMQX_API_SECRET:-linkflow-init-secret}
      BACKEND_AUTH_URL: ${BACKEND_AUTH_URL:-http://backend:18080/internal/emqx/auth}
      KAFKA_BOOTSTRAP: ${KAFKA_CONTAINER_BOOTSTRAP:-redpanda:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-lf.v1.device.events}
    volumes:
      - ./init-scripts/emqx:/init-scripts/emqx:ro
    entrypoint:
      - /bin/sh
    command:
      - -c
      - "sh /init-scripts/emqx/init-emqx.sh" # 改这一行
    networks:
      - linkflow

  backend:
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
    container_name: linkflow-backend
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_HTTP_PORT:-18080}:18080"
    environment:
      HTTP_ADDR: ${BACKEND_HTTP_ADDR:-:18080}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-5s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-10s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      HTTP_REQUEST_TIMEOUT: ${HTTP_REQUEST_TIMEOUT:-5s}
      POSTGRES_DSN: ${BACKEND_POSTGRES_DSN:-postgres://linkflow:linkflow123@timescaledb:5432/linkflow?sslmode=disable}
      POSTGRES_MAX_OPEN_CONNS: "${POSTGRES_MAX_OPEN_CONNS:-10}"
      POSTGRES_MAX_IDLE_CONNS: "${POSTGRES_MAX_IDLE_CONNS:-5}"
      POSTGRES_CONN_MAX_LIFETIME: ${POSTGRES_CONN_MAX_LIFETIME:-30m}
      POSTGRES_CONN_MAX_IDLE_TIME: ${POSTGRES_CONN_MAX_IDLE_TIME:-5m}
      REDIS_ADDR: ${BACKEND_REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: "${REDIS_DB:-0}"
      REDIS_DIAL_TIMEOUT: ${REDIS_DIAL_TIMEOUT:-5s}
      REDIS_READ_TIMEOUT: ${REDIS_READ_TIMEOUT:-3s}
      REDIS_WRITE_TIMEOUT: ${REDIS_WRITE_TIMEOUT:-3s}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:-dev-only-linkflow-access-token-secret-change-before-production}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-24h}
      AUTH_TOKEN_ISSUER: ${AUTH_TOKEN_ISSUER:-linkflow-backend}
      AUTH_BCRYPT_COST: "${AUTH_BCRYPT_COST:-12}"
      MQTT_GATEWAY_USERNAME: ${MQTT_GATEWAY_USERNAME:-linkflow-mqtt-gateway}
      MQTT_GATEWAY_PASSWORD: ${MQTT_GATEWAY_PASSWORD:-linkflow-mqtt-gateway-secret}
      KAFKA_BROKERS: ${KAFKA_CONTAINER_BROKERS:-redpanda:9092}
      REALTIME_GROUP_ID: ${REALTIME_GROUP_ID:-}
      REALTIME_ACCESS_COOKIE: ${REALTIME_ACCESS_COOKIE:-lf_access}
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:18080/internal/emqx/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - linkflow

  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: linkflow-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
    networks:
      - linkflow

  device-event-processor:
    build:
      context: ..
      dockerfile: deploy/docker/device-event-processor.Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
    container_name: linkflow-device-event-processor
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: ${KAFKA_CONTAINER_BROKERS:-redpanda:9092}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-device-event-processor}
      CONSUMER_WORKERS: "${CONSUMER_WORKERS:-4}"
      CONSUMER_BUFFER: "${CONSUMER_BUFFER:-128}"
      CONSUMER_MAX_RETRIES: "${CONSUMER_MAX_RETRIES:-3}"
      CONSUMER_RETRY_BACKOFF: ${CONSUMER_RETRY_BACKOFF:-200ms}
      POSTGRES_DSN: ${DEVICE_EVENT_PROCESSOR_POSTGRES_DSN:-postgres://linkflow:linkflow123@timescaledb:5432/linkflow?sslmode=disable}
      POSTGRES_MAX_OPEN_CONNS: "${POSTGRES_MAX_OPEN_CONNS:-10}"
      POSTGRES_MAX_IDLE_CONNS: "${POSTGRES_MAX_IDLE_CONNS:-5}"
      POSTGRES_CONN_MAX_LIFETIME: ${POSTGRES_CONN_MAX_LIFETIME:-30m}
      POSTGRES_CONN_MAX_IDLE_TIME: ${POSTGRES_CONN_MAX_IDLE_TIME:-5m}
      REDIS_ADDR: ${DEVICE_EVENT_PROCESSOR_REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: "${REDIS_DB:-0}"
      REDIS_DIAL_TIMEOUT: ${REDIS_DIAL_TIMEOUT:-5s}
      REDIS_READ_TIMEOUT: ${REDIS_READ_TIMEOUT:-3s}
      REDIS_WRITE_TIMEOUT: ${REDIS_WRITE_TIMEOUT:-3s}
      DEVICE_ONLINE_TTL: ${DEVICE_ONLINE_TTL:-120s}
      EMQX_API_URL: ${EMQX_CONTAINER_API_URL:-http://emqx:18083}
      EMQX_API_KEY: ${EMQX_API_KEY:-linkflow-init}
      EMQX_API_SECRET: ${EMQX_API_SECRET:-linkflow-init-secret}
      EMQX_PUBLISH_TIMEOUT: ${EMQX_PUBLISH_TIMEOUT:-3s}
      CONTRACTS_DIR: ${CONTRACTS_CONTAINER_DIR:-/app/contracts}
    networks:
      - linkflow

  # mqtt-gateway is legacy and intentionally disabled.
  # Current MQTT ingress path: EMQX Rule Engine -> Redpanda lf.v1.device.events.
  # mqtt-gateway:
  #   build:
  #     context: ..
  #     dockerfile: deploy/docker/mqtt-gateway.Dockerfile
  #     args:
  #       GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
  #       GOSUMDB: ${GOSUMDB:-sum.golang.org}
  #   container_name: linkflow-mqtt-gateway
  #   restart: unless-stopped
  #   depends_on:
  #     emqx:
  #       condition: service_healthy
  #     emqx-init:
  #       condition: service_completed_successfully
  #     redpanda:
  #       condition: service_healthy
  #     redpanda-init:
  #       condition: service_completed_successfully
  #   environment:
  #     MQTT_BROKER_URL: tcp://emqx:1883
  #     MQTT_CLIENT_ID: linkflow-mqtt-gateway
  #     MQTT_USERNAME: linkflow-mqtt-gateway
  #     MQTT_PASSWORD: linkflow-mqtt-gateway-secret
  #     MQTT_CLEAN_SESSION: "true"
  #     KAFKA_BROKER_URL: redpanda:9092
  #     LF_TENANT_ID: default
  #   networks:
  #     - linkflow

  # ============================================
  # Redpanda - Kafka 协议兼容的消息总线
  # Kafka (宿主机访问): localhost:19092
  # Kafka (容器内访问): redpanda:9092
  # Admin API:           localhost:19644
  # ============================================
  redpanda:
    image: redpandadata/redpanda:v23.3.5
    container_name: linkflow-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:${REDPANDA_KAFKA_PORT:-19092}
      - --advertise-kafka-addr=internal://redpanda:9092,external://${REDPANDA_ADVERTISE_HOST:-localhost}:${REDPANDA_KAFKA_PORT:-19092}
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:${REDPANDA_REST_PROXY_PORT:-18082}
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://${REDPANDA_ADVERTISE_HOST:-localhost}:${REDPANDA_REST_PROXY_PORT:-18082}
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:${REDPANDA_SCHEMA_REGISTRY_PORT:-18081}
      - --rpc-addr=redpanda:${REDPANDA_RPC_PORT:-33145}
      - --advertise-rpc-addr=redpanda:${REDPANDA_RPC_PORT:-33145}
      - --smp=${REDPANDA_SMP:-1}
      - --memory=${REDPANDA_MEMORY:-1G}
      - --mode=dev-container
      - --default-log-level=${REDPANDA_LOG_LEVEL:-info}
    ports:
      - "${REDPANDA_SCHEMA_REGISTRY_PORT:-18081}:${REDPANDA_SCHEMA_REGISTRY_PORT:-18081}" # Schema Registry
      - "${REDPANDA_REST_PROXY_PORT:-18082}:${REDPANDA_REST_PROXY_PORT:-18082}" # REST Proxy
      - "${REDPANDA_KAFKA_PORT:-19092}:${REDPANDA_KAFKA_PORT:-19092}" # Kafka (宿主机访问)
      - "${REDPANDA_ADMIN_API_PORT:-19644}:9644" # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - linkflow

  # Redpanda topic bootstrap - idempotent one-shot initializer
  redpanda-init:
    image: redpandadata/redpanda:v23.3.5
    container_name: linkflow-redpanda-init
    restart: "no"
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: ${KAFKA_CONTAINER_BROKERS:-redpanda:9092}
    volumes:
      - ./init-scripts/redpanda:/init-scripts/redpanda:ro
    entrypoint:
      - /bin/sh
    command:
      - /init-scripts/redpanda/01-create-topics.sh
    networks:
      - linkflow

  # Redpanda Console - Kafka 可视化管理界面
  # http://localhost:8080
  redpanda-console:
    image: redpandadata/console:v2.4.5
    container_name: linkflow-redpanda-console
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8080}:8080"
    environment:
      KAFKA_BROKERS: ${KAFKA_CONTAINER_BROKERS:-redpanda:9092}
      KAFKA_SCHEMAREGISTRY_ENABLED: "${KAFKA_SCHEMAREGISTRY_ENABLED:-true}"
      KAFKA_SCHEMAREGISTRY_URLS: ${KAFKA_SCHEMAREGISTRY_URLS:-http://redpanda:8081}
      REDPANDA_ADMINAPI_ENABLED: "${REDPANDA_ADMINAPI_ENABLED:-true}"
      REDPANDA_ADMINAPI_URLS: ${REDPANDA_ADMINAPI_URLS:-http://redpanda:9644}
    networks:
      - linkflow

  # ============================================
  # TimescaleDB - PostgreSQL + 时序扩展
  # 用一个数据库实例同时支撑业务数据和时序数据
  # 连接: postgres://linkflow:linkflow123@localhost:5432/linkflow
  # ============================================
  timescaledb:
    image: timescale/timescaledb:2.13.0-pg16
    container_name: linkflow-timescaledb
    restart: unless-stopped
    ports:
      - "${TIMESCALEDB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkflow123}
      POSTGRES_DB: ${POSTGRES_DB:-linkflow}
      TS_TUNE_MEMORY: ${TS_TUNE_MEMORY:-2GB}
      TS_TUNE_NUM_CPUS: "${TS_TUNE_NUM_CPUS:-2}"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./init-scripts/timescaledb:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U linkflow -d linkflow" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - linkflow

  # ============================================
  # Redis - 缓存 / 在线状态 / 分布式锁
  # 连接: redis://localhost:6379
  # ============================================
  redis:
    image: redis:7.2-alpine
    container_name: linkflow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --appendonly
      - "${REDIS_APPENDONLY:-yes}"
      - --maxmemory
      - "${REDIS_MAXMEMORY:-512mb}"
      - --maxmemory-policy
      - "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - linkflow

# ============================================
# 数据卷 - 持久化数据,避免重启后丢失
# ============================================
volumes:
  emqx_data:
  emqx_log:
  redpanda_data:
  timescaledb_data:
  redis_data:

    # ============================================
    # 自定义网络 - 让所有服务用容器名互相访问
    # ============================================
networks:
  linkflow:
    name: linkflow-network
    driver: bridge
